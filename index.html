<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M.S.G. — ONE YEAR WAR SIMULATOR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070b; --panel:#0b121d; --panel2:#0f1a29; --line:#1c2b3d;
  --fed:#2fd8ff; --fed-dim:#134a5c;
  --zeon:#ff5a3c; --zeon-dim:#5c2013;
  --char:#ff2f8f; --char-dim:#5c1338;
  --ae:#d9b64e; --ae-dim:#4d3f14;
  --guild:#3ddc97; --guild-dim:#155c3f;
  --amber:#ffd23f; --text:#dbe6f0; --muted:#6f8296;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(ellipse at 20% -10%,#0c2233 0%,transparent 55%),
             radial-gradient(ellipse at 100% 110%,#2a0f10 0%,transparent 45%), var(--bg);
  color:var(--text); font-family:'Noto Sans JP',sans-serif; min-height:100vh;
}
.hexbg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.3;
  background-image:linear-gradient(30deg,#0d1826 12%,transparent 12.5%,transparent 87%,#0d1826 87.5%,#0d1826),
    linear-gradient(150deg,#0d1826 12%,transparent 12.5%,transparent 87%,#0d1826 87.5%,#0d1826),
    linear-gradient(30deg,#0d1826 12%,transparent 12.5%,transparent 87%,#0d1826 87.5%,#0d1826),
    linear-gradient(150deg,#0d1826 12%,transparent 12.5%,transparent 87%,#0d1826 87.5%,#0d1826);
  background-size:44px 76px; background-position:0 0,0 0,22px 38px,22px 38px;}
#root{position:relative;z-index:2;max-width:720px;margin:0 auto;padding:16px 14px 60px;}
.brand{font-family:'Orbitron',sans-serif;font-weight:900;font-size:14px;letter-spacing:1.5px;color:var(--amber);text-align:center;}
.brand span{color:var(--muted);font-weight:500;font-size:10px;letter-spacing:2px;display:block;margin-top:3px;}
.topbar{margin-bottom:14px;}
.turnrow{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:8px;}
.turndot{width:8px;height:8px;background:var(--line);transform:rotate(45deg);}
.turndot.done{background:var(--amber);box-shadow:0 0 6px var(--amber);}
.turndot.now{background:var(--text);box-shadow:0 0 8px var(--text);animation:pulse 1.2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.turnlabel{font-family:'Orbitron';font-size:10.5px;color:var(--muted);letter-spacing:1px;}

.gauges{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;}
.gaugebox{background:var(--panel);border:1px solid var(--line);padding:8px 9px;}
.gaugebox.fed{border-left:3px solid var(--fed);} .gaugebox.zeon{border-left:3px solid var(--zeon);} .gaugebox.guild{border-left:3px solid var(--guild);}
.gaugehead{display:flex;flex-direction:column;font-family:'Orbitron';font-size:9px;letter-spacing:.3px;color:var(--muted);margin-bottom:5px;}
.gaugehead b{font-size:16px;font-family:'Orbitron';margin-top:1px;}
.gaugebox.fed .gaugehead b{color:var(--fed);} .gaugebox.zeon .gaugehead b{color:var(--zeon);} .gaugebox.guild .gaugehead b{color:var(--guild);}
.gaugetrack{height:8px;background:#050a10;border:1px solid var(--line);}
.gaugefill{height:100%;transition:width .9s cubic-bezier(.2,.8,.2,1);}
.gaugebox.fed .gaugefill{background:linear-gradient(90deg,var(--fed-dim),var(--fed));box-shadow:0 0 8px var(--fed);}
.gaugebox.zeon .gaugefill{background:linear-gradient(90deg,var(--zeon-dim),var(--zeon));box-shadow:0 0 8px var(--zeon);}
.gaugebox.guild .gaugefill{background:linear-gradient(90deg,var(--guild-dim),var(--guild));box-shadow:0 0 8px var(--guild);}

.panel{background:var(--panel);border:1px solid var(--line);padding:18px 16px;margin-bottom:14px;position:relative;}
.panel:before{content:"";position:absolute;top:0;left:0;width:18px;height:18px;border-top:2px solid var(--amber);border-left:2px solid var(--amber);opacity:.6;}
.panel:after{content:"";position:absolute;bottom:0;right:0;width:18px;height:18px;border-bottom:2px solid var(--amber);border-right:2px solid var(--amber);opacity:.6;}
h1.evt{font-family:'Orbitron';font-size:17px;color:var(--amber);letter-spacing:.5px;margin:0 0 10px;}
.narration{font-size:15px;line-height:1.85;white-space:pre-wrap;}
.title-hero{font-family:'Orbitron';font-size:21px;color:var(--amber);text-align:center;letter-spacing:.5px;margin-bottom:6px;}
.sub-hero{text-align:center;color:var(--muted);font-size:12px;margin-bottom:18px;letter-spacing:.5px;}

.choices{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
.choice{background:var(--panel2);border:1px solid var(--line);padding:13px 15px;cursor:pointer;text-align:left;color:var(--text);font-family:inherit;width:100%;transition:.15s;}
.choice:active{transform:scale(.98);}
.choice:hover{border-color:var(--amber);}
.choice .clabel{font-weight:700;font-size:14.5px;}
.choice .cdesc{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.6;}
.choice.picked{border-color:var(--amber);background:#1a1a10;}
.choice:disabled{opacity:.4;cursor:default;}

.btn{font-family:'Orbitron';font-size:12px;letter-spacing:1px;background:transparent;border:1px solid var(--amber);color:var(--amber);padding:12px 20px;cursor:pointer;width:100%;}
.btn:active{background:var(--amber);color:#1a1400;}
.btn:disabled{opacity:.3;}
.btn.secondary{border-color:var(--muted);color:var(--muted);font-size:11px;padding:9px 14px;}
.btnrow{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
.btnrow .btn{flex:1;min-width:140px;}

.big2{display:flex;flex-direction:column;gap:12px;margin-top:10px;}
.bigchoice{background:var(--panel2);border:1px solid var(--line);padding:22px 18px;font-family:'Orbitron';font-size:14px;letter-spacing:1px;color:var(--text);cursor:pointer;text-align:center;}
.bigchoice:active{border-color:var(--amber);}

.rolecard{background:var(--panel2);border:1px solid var(--line);padding:16px;text-align:center;margin-top:12px;}
.rolecard.fed{border-left:4px solid var(--fed);} .rolecard.zeon{border-left:4px solid var(--zeon);}
.rolecard.char{border-left:4px solid var(--char);} .rolecard.ae{border-left:4px solid var(--ae);} .rolecard.guild,.rolecard.neutral{border-left:4px solid var(--guild);}
.rolefaction{font-family:'Orbitron';font-size:10.5px;letter-spacing:1.5px;color:var(--muted);}
.roletitle{font-size:18px;font-weight:900;margin:6px 0;}
.rolecard.fed .roletitle{color:var(--fed);} .rolecard.zeon .roletitle{color:var(--zeon);}
.rolecard.char .roletitle{color:var(--char);} .rolecard.ae .roletitle{color:var(--ae);} .rolecard.guild .roletitle,.rolecard.neutral .roletitle{color:var(--guild);}
.roleflavor{font-size:12px;color:var(--muted);line-height:1.7;margin-top:8px;}

.rosterlist{margin-top:10px;}
.rosteritem{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-size:12.5px;}
.rosteritem .rn{font-weight:700;}
.rosteritem .rt{color:var(--muted);font-size:11px;}
.chip{font-family:'Orbitron';font-size:9px;letter-spacing:1px;padding:2px 7px;border-radius:2px;color:var(--amber);border:1px solid var(--amber);}
.chip.fed{color:var(--fed);border:1px solid var(--fed);} .chip.zeon{color:var(--zeon);border:1px solid var(--zeon);}
.chip.char{color:var(--char);border:1px solid var(--char);} .chip.ae{color:var(--ae);border:1px solid var(--ae);} .chip.guild,.chip.neutral{color:var(--guild);border:1px solid var(--guild);}

.loadwrap{text-align:center;padding:50px 20px;}
.loader{width:46px;height:46px;margin:0 auto 18px;border:2px solid var(--line);border-top:2px solid var(--amber);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loadmsg{font-family:'Orbitron';font-size:11.5px;color:var(--muted);letter-spacing:1px;}

.tally{margin-top:10px;}
.tallyrow{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.tallybar{flex:1;height:14px;background:#050a10;border:1px solid var(--line);}
.tallyfill{height:100%;background:linear-gradient(90deg,#3a2f00,var(--amber));transition:width .6s;}
.tallynum{font-family:'Orbitron';width:22px;text-align:right;font-size:12px;}
.votecount{text-align:center;font-family:'Orbitron';font-size:11px;color:var(--muted);letter-spacing:1px;margin-top:10px;}

.log{max-height:150px;overflow-y:auto;font-size:11.5px;color:var(--muted);border-top:1px dashed var(--line);margin-top:14px;padding-top:8px;}
.log div{margin-bottom:5px;padding-left:8px;border-left:2px solid var(--line);}
.log b{color:var(--text);}

.evalcard{background:var(--panel2);border:1px solid var(--line);padding:11px 13px;display:flex;gap:12px;align-items:center;margin-bottom:7px;}
.evalcard.fed{border-left:3px solid var(--fed);} .evalcard.zeon{border-left:3px solid var(--zeon);}
.evalcard.char{border-left:3px solid var(--char);} .evalcard.ae{border-left:3px solid var(--ae);} .evalcard.guild,.evalcard.neutral{border-left:3px solid var(--guild);}
.evalcard.me{background:#1a1a10;}
.evalscore{font-family:'Orbitron';font-size:24px;font-weight:900;width:36px;text-align:center;color:var(--amber);}
.evalname{font-weight:700;font-size:13px;margin-bottom:2px;}
.evalcomment{font-size:11.5px;color:var(--muted);line-height:1.6;}

.errbox{border:1px solid var(--zeon);color:var(--zeon);padding:8px 12px;font-size:11px;margin-top:10px;}
.field{width:100%;background:#050a10;border:1px solid var(--line);color:var(--text);padding:12px;font-family:inherit;font-size:15px;margin-top:10px;}
.field:focus{outline:none;border-color:var(--amber);}
.hint{font-size:11px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.6;}
.waitline{text-align:center;color:var(--muted);font-family:'Orbitron';font-size:11px;letter-spacing:1px;margin-top:16px;}
.dot3{display:inline-block;animation:blink2 1.4s infinite;}
@keyframes blink2{0%,100%{opacity:.2}50%{opacity:1}}
.setupbox{background:var(--panel2);border:1px solid var(--zeon);padding:14px;font-size:12px;line-height:1.8;margin-bottom:16px;}
.setupbox b{color:var(--amber);}
</style>

<script type="module">

const FED_TITLES  = ["元連邦軍属 傭兵隊長","元連邦軍 通信士上がりの操縦士","連邦に伝手を持つ交渉役","連邦寄りの物資調達係","元連邦軍 整備士"];
const ZEON_TITLES = ["元ジオン兵 整備主任","元ジオン公国軍属 戦術顧問","ジオン残留将校と伝手を持つ斡旋屋","ジオン系コロニー出身の情報屋","元ジオン軍 操縦士"];
const NEUTRAL_TITLES = ["ジャンク屋ギルド長","廃品回収船 船長","独立警備隊 情報屋","流れの凄腕パイロット","コロニー難民支援ネットワーク代表","中立コロニー 交易商","サイド6 自警団長"];
const CHAR_TITLES = ["表向きは一般隊員、実はシャア個人の密偵","シャア個人に恩義があるという古参"];
const AE_TITLES   = ["AE社と裏で通じる兵器ブローカー","AE社から資金提供を受ける技術屋"];
const FLAVOR = {
  fed:"心情としては連邦寄り。ギルドの一員である以上は中立を装うが、連邦側に肩入れしたくなる場面もあるだろう。",
  zeon:"心情としてはジオン寄り。ギルドの一員である以上は中立を装うが、ジオン側に肩入れしたくなる場面もあるだろう。",
  neutral:"生粋のノンポリ、あるいは徹底したリアリスト。どちらにも肩入れせず、ギルドと自分たちの生存を最優先に考える。",
  char:"表向きは中立なギルドの一員だが、実際はシャア個人に密かな忠誠を誓っている。ギルド全体の利益より、彼の思惑を優先する場面があってもいい。",
  ae:"表向きは中立なギルドの一員だが、実際はAE社と裏で通じている。戦争そのものより、自分（と会社）の利益を優先する場面があってもいい。"
};
const FACTION_LABEL = {fed:"ギルド(連邦寄り)",zeon:"ギルド(ジオン寄り)",neutral:"ギルド(中立)",char:"ギルド(シャア派)",ae:"ギルド(AE社系)"};
const WAR_PERIODS = ["開戦","コロニー落とし前後","緒戦、ジオン優勢","地球降下作戦","膠着する戦線","連邦の反攻作戦","新型兵器の投入","宇宙要塞攻防戦","終戦前夜","最終決戦"];
const TOTAL_TURNS = 10;

/* ---------- Supabase helpers ---------- */
async function fetchGameState(){
  const { data, error } = await supabase.from('game_state').select('*').eq('id',1).single();
  if(error){ console.error(error); return null; }
  return mapGameRow(data);
}
function mapGameRow(row){
  if(!row) return null;
  return {
    phase: row.phase, turn: row.turn, fed: row.fed, zeon: row.zeon, guild: row.guild,
    currentEvent: row.current_event, chosenIdx: row.chosen_idx, tally: row.tally, tieBreak: row.tie_break,
    lastResolution: row.last_resolution, ending: row.ending, history: row.history || []
  };
}
async function fetchRoster(){
  const { data, error } = await supabase.from('players').select('*').order('joined_at');
  if(error){ console.error(error); return []; }
  return data;
}
async function insertPlayer(p){
  const { error } = await supabase.from('players').insert({ id:p.id, name:p.name, faction:p.faction, title:p.title });
  if(error) throw error;
}
async function fetchVotes(turn){
  const { data, error } = await supabase.from('votes').select('*').eq('turn', turn);
  if(error){ console.error(error); return []; }
  return data;
}
async function insertVote(turn, playerId, choiceIdx){
  const { error } = await supabase.from('votes').insert({ turn, player_id: playerId, choice_idx: choiceIdx });
  if(error && error.code !== '23505') throw error; // 23505 = unique_violation (既に投票済み)
}
async function myExistingVote(turn, playerId){
  const { data } = await supabase.from('votes').select('*').eq('turn', turn).eq('player_id', playerId).maybeSingle();
  return data;
}
async function updateGameState(patch){
  const { error } = await supabase.from('game_state').update({ ...patch, updated_at: new Date().toISOString() }).eq('id',1);
  if(error) throw error;
}
async function resetAllData(){
  await supabase.from('votes').delete().neq('turn', -1);
  await supabase.from('players').delete().neq('id', '00000000-0000-0000-0000-000000000000');
  await updateGameState({ phase:'lobby', turn:0, fed:50, zeon:50, guild:65, current_event:null, chosen_idx:null, tally:null, tie_break:false, last_resolution:null, ending:null, history:[] });
}
async function callGameAI(action, payload){
  const { data, error } = await supabase.functions.invoke('game-ai', { body: { action, ...(payload||{}) } });
  if(error) throw new Error(error.message || String(error));
  if(!data || !data.ok) throw new Error((data && data.error) || "AI呼び出しに失敗しました");
  return data;
}

function historyText(history){
  if(!history || history.length===0) return "（まだ何も起きていない。開戦直前。）";
  return history.map(h=>`第${h.turn}ターン「${h.title}」→ 選択:${h.chosenLabel} → ${h.summary}`).join("\n");
}
function fallbackEvent(){
  return {title:"漂流する避難民",narration:"サイド7近郊で、連邦・ジオン双方の民間人を乗せた漂流船を発見した。放っておけば全員が命を落とす。",
    choices:[
      {label:"両陣営の民間人を全員救助する",description:"中立を掲げるギルドとして筋を通す"},
      {label:"連邦系の乗員だけを優先的に救助する",description:"仲間内の連邦寄りの声に応える"},
      {label:"見なかったことにして立ち去る",description:"巻き込まれるリスクを避ける"},
      {label:"漂流船ごと第三勢力に売り渡す",description:"非情だが実利は大きい賭けに出る"}
    ]};
}
function fallbackResolution(chosenLabel){
  const fd = Math.floor(Math.random()*10)-5, zd = Math.floor(Math.random()*10)-5, gd = Math.floor(Math.random()*20)-8;
  return {resolutionText:`「${chosenLabel}」という決断に、ギルドの中でも反応は割れた。`, fedGaugeDelta:fd, zeonGaugeDelta:zd, guildGaugeDelta:gd, summary:`${chosenLabel}の余波でギルド内の空気が揺れる`};
}
function fallbackEnding(fed, zeon, roster){
  const fedWin = fed >= zeon;
  return {
    endingTitle: fedWin ? "地球は静寂を取り戻した" : "宇宙世紀は新たな均衡へ",
    endingNarration: "サイド6に根を張ったこの小さなギルドは、内輪の立場の違いを抱えながらも、最後まで解散せずに生き延びた。",
    evaluations: roster.map(()=>({score:"B", comment:"役割を果たした。"}))
  };
}

/* ---------- role assignment (client-side, no secret needed) ---------- */
function assignRole(roster){
  const fedC=roster.filter(p=>p.faction==='fed').length, zeonC=roster.filter(p=>p.faction==='zeon').length;
  const neutralC=roster.filter(p=>p.faction==='neutral').length;
  const charC=roster.filter(p=>p.faction==='char').length, aeC=roster.filter(p=>p.faction==='ae').length;
  const total = roster.length;
  const cap = Math.max(1, Math.floor((total+1)/7));
  const roll = Math.random();
  let faction;
  if(roll < 0.05 && charC < cap) faction='char';
  else if(roll < 0.10 && aeC < cap) faction='ae';
  else{
    const counts = {fed:fedC, zeon:zeonC, neutral:neutralC};
    const min = Math.min(counts.fed, counts.zeon, counts.neutral);
    const tied = Object.keys(counts).filter(k=>counts[k]===min);
    faction = tied[Math.floor(Math.random()*tied.length)];
  }
  const pool = {fed:FED_TITLES, zeon:ZEON_TITLES, char:CHAR_TITLES, ae:AE_TITLES, neutral:NEUTRAL_TITLES}[faction];
  const used = roster.filter(p=>p.faction===faction).map(p=>p.title);
  const avail = pool.filter(t=>!used.includes(t));
  const list = avail.length ? avail : pool;
  const title = list[Math.floor(Math.random()*list.length)];
  return {faction, title};
}
function uuid(){
  if(crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
    const r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8); return v.toString(16);
  });
}

/* ---------- app state ---------- */
let S = { screen:"landing", myId:null, myPlayer:null, meta:null, roster:[], votedThisTurn:false, pollTimer:null, adminBusy:false, err:null, nameInput:"" };
const root = document.getElementById('root');
function render(){ root.innerHTML = views[S.screen](); attach(); }
function stopPoll(){ if(S.pollTimer){ clearInterval(S.pollTimer); S.pollTimer=null; } }

/* ---------- player actions ---------- */
async function registerPlayer(){
  const name = S.nameInput.trim();
  if(!name) return;
  S.screen="loading"; S.loadMsg="役職を割り当て中..."; render();
  const roster = await fetchRoster();
  const {faction,title} = assignRole(roster);
  const id = uuid();
  const player = {id, name, faction, title};
  await insertPlayer(player);
  S.myId=id; S.myPlayer=player; S.votedThisTurn=false; S.lastSeenTurn=-1;
  S.screen="playerLobby"; render();
  pollAsPlayer();
}
function pollAsPlayer(){
  stopPoll();
  const tick = async ()=>{
    const meta = await fetchGameState();
    if(!meta || meta.phase==='lobby'){
      if(S.screen!=='playerLobby'){ S.screen='playerLobby'; }
      S.meta = meta; render(); return;
    }
    S.meta = meta;
    if(meta.turn !== S.lastSeenTurn){ S.votedThisTurn=false; S.lastSeenTurn=meta.turn; }
    if(meta.phase==='voting' && !S.votedThisTurn){
      const myVote = await myExistingVote(meta.turn, S.myId);
      if(myVote) S.votedThisTurn = true;
    }
    S.screen = meta.phase; render();
  };
  tick();
  S.pollTimer = setInterval(tick, 2500);
}
async function submitVote(idx){
  if(S.votedThisTurn) return;
  S.votedThisTurn = true; render();
  try{ await insertVote(S.meta.turn, S.myId, idx); }catch(e){ console.error(e); }
}

/* ---------- admin actions ---------- */
function pollAsAdmin(){
  stopPoll();
  const tick = async ()=>{
    S.roster = await fetchRoster();
    if(S.meta && S.meta.phase==='voting'){ S.votes = await fetchVotes(S.meta.turn); }
    if(!S.adminBusy) render();
  };
  tick();
  S.pollTimer = setInterval(tick, 2500);
}
async function adminStartGame(){
  if(S.roster.length < 2){ S.err="最低2名の参加が必要です"; render(); return; }
  S.adminBusy = true;
  await updateGameState({ phase:'loading', turn:1, fed:50, zeon:50, guild:65, current_event:null, chosen_idx:null, tally:null, tie_break:false, last_resolution:null, ending:null, history:[] });
  await adminGenerateEvent();
}
async function adminGenerateEvent(){
  S.err=null; S.adminBusy=true; S.screen='loading'; S.loadMsg='次のイベントを解析中...'; render();
  try{ await callGameAI('generate_event'); }
  catch(e){ S.err="AI接続に問題が発生したため、代替シナリオを表示しています。（詳細: "+e.message+"）"; }
  S.meta = await fetchGameState();
  S.votes = []; S.adminBusy=false; S.screen='voting'; render();
}
async function adminCloseVoting(){
  S.adminBusy = true;
  const votes = await fetchVotes(S.meta.turn);
  const counts = S.meta.currentEvent.choices.map((c,i)=>votes.filter(v=>v.choice_idx===i).length);
  const max = Math.max(...counts);
  const winners = counts.map((c,i)=>c===max?i:-1).filter(i=>i>=0);
  const chosenIdx = winners[Math.floor(Math.random()*winners.length)];
  await updateGameState({ phase:'tally', chosen_idx: chosenIdx, tally: counts, tie_break: winners.length>1 });
  S.meta = await fetchGameState();
  S.adminBusy=false; S.screen='tally'; render();
}
async function adminResolve(){
  S.err=null; S.adminBusy = true; S.screen='loading'; S.loadMsg='選択の結果を演算中...'; render();
  try{ await callGameAI('resolve'); }
  catch(e){ S.err="AI接続に問題が発生したため、代替結果を表示しています。（詳細: "+e.message+"）"; }
  S.meta = await fetchGameState();
  S.adminBusy=false; S.screen='resolution'; render();
}
async function adminNext(){
  if(S.meta.turn >= TOTAL_TURNS){ await adminGenerateEnding(); }
  else{ await updateGameState({ turn: S.meta.turn+1 }); await adminGenerateEvent(); }
}
async function adminGenerateEnding(){
  S.err=null; S.adminBusy=true; S.screen='loading'; S.loadMsg='一年戦争の結末を編纂中...'; render();
  try{ await callGameAI('generate_ending'); }
  catch(e){ S.err="AI接続に問題が発生したため、代替エンディングを表示しています。（詳細: "+e.message+"）"; }
  S.meta = await fetchGameState();
  S.adminBusy=false; S.screen='ending'; render();
}
async function adminResetAll(){
  stopPoll();
  await resetAllData();
  S = { screen:"landing", myId:null, myPlayer:null, meta:null, roster:[], votedThisTurn:false, pollTimer:null, adminBusy:false, err:null, nameInput:"" };
  render();
}

/* ---------- solo mode (fully local state; only the edge function is called) ---------- */
async function soloRegister(){
  const name = S.nameInput.trim();
  if(!name) return;
  S.screen="loading"; S.loadMsg="役職を割り当て中..."; render();
  const {faction,title} = assignRole([]);
  S.myId = 'solo-'+uuid(); S.myPlayer = {id:S.myId, name, faction, title};
  S.screen="soloRoleReveal"; render();
}
async function soloStartGame(){
  S.meta = { phase:'loading', turn:1, fed:50, zeon:50, guild:65, currentEvent:null, lastResolution:null, ending:null, history:[] };
  await soloGenerateEvent();
}
async function soloGenerateEvent(){
  S.err=null; S.meta.phase='loading'; S.screen='loading'; S.loadMsg='次のイベントを解析中...'; render();
  try{
    const { event } = await callGameAI('solo_generate_event', {
      player: S.myPlayer, turn: S.meta.turn, fed: S.meta.fed, zeon: S.meta.zeon, guild: S.meta.guild, history: S.meta.history
    });
    S.meta.currentEvent = event;
  }catch(e){ S.meta.currentEvent = fallbackEvent(); S.err="AI接続に問題が発生したため、代替シナリオを表示しています。（詳細: "+e.message+"）"; }
  S.meta.phase='voting'; S.screen='soloVoting'; render();
}
async function soloChoose(idx){
  S.meta.chosenIdx = idx;
  S.err=null; S.meta.phase='loading'; S.screen='loading'; S.loadMsg='選択の結果を演算中...'; render();
  const chosen = S.meta.currentEvent.choices[idx];
  let res;
  try{
    const r = await callGameAI('solo_resolve', {
      turn: S.meta.turn, fed: S.meta.fed, zeon: S.meta.zeon, guild: S.meta.guild,
      history: S.meta.history, currentEvent: S.meta.currentEvent, chosenIdx: idx
    });
    res = r.resolution;
  }catch(e){ res = fallbackResolution(chosen.label); S.err="AI接続に問題が発生したため、代替結果を表示しています。（詳細: "+e.message+"）"; }
  S.meta.fed = Math.max(0, Math.min(100, S.meta.fed + (res.fedGaugeDelta||0)));
  S.meta.zeon = Math.max(0, Math.min(100, S.meta.zeon + (res.zeonGaugeDelta||0)));
  S.meta.guild = Math.max(0, Math.min(100, S.meta.guild + (res.guildGaugeDelta||0)));
  S.meta.history.push({turn:S.meta.turn, title:S.meta.currentEvent.title, summary:res.summary||"", chosenLabel:chosen.label});
  S.meta.lastResolution = res; S.meta.phase='resolution';
  S.screen='resolution'; render();
}
async function soloNext(){
  if(S.meta.turn >= TOTAL_TURNS){ await soloGenerateEnding(); }
  else{ S.meta.turn++; await soloGenerateEvent(); }
}
async function soloGenerateEnding(){
  S.err=null; S.meta.phase='loading'; S.screen='loading'; S.loadMsg='一年戦争の結末を編纂中...'; render();
  let ending;
  try{
    const r = await callGameAI('solo_generate_ending', {
      player: S.myPlayer, fed: S.meta.fed, zeon: S.meta.zeon, guild: S.meta.guild, history: S.meta.history
    });
    ending = r.ending;
  }catch(e){ ending = fallbackEnding(S.meta.fed, S.meta.zeon, [S.myPlayer]); S.err="AI接続に問題が発生したため、代替エンディングを表示しています。（詳細: "+e.message+"）"; }
  S.meta.ending = ending; S.meta.endingRoster = [S.myPlayer]; S.meta.phase='ending';
  S.screen='ending'; render();
}
function soloReset(){
  S = { screen:"landing", myId:null, myPlayer:null, meta:null, roster:[], votedThisTurn:false, pollTimer:null, adminBusy:false, err:null, nameInput:"" };
  render();
}

/* ---------- shared UI blocks ---------- */
function gaugeBlock(fed, zeon, guild){
  guild = guild==null ? 20 : guild;
  return `<div class="gauges">
    <div class="gaugebox fed"><div class="gaugehead"><span>連邦</span><b>${fed}%</b></div><div class="gaugetrack"><div class="gaugefill" style="width:${fed}%"></div></div></div>
    <div class="gaugebox zeon"><div class="gaugehead"><span>ジオン</span><b>${zeon}%</b></div><div class="gaugetrack"><div class="gaugefill" style="width:${zeon}%"></div></div></div>
    <div class="gaugebox guild"><div class="gaugehead"><span>ギルド結束度</span><b>${guild}%</b></div><div class="gaugetrack"><div class="gaugefill" style="width:${guild}%"></div></div></div>
  </div>`;
}
function topBar(turn){
  let dots="";
  for(let i=1;i<=TOTAL_TURNS;i++){ dots += `<div class="turndot ${i<turn?'done':(i===turn?'now':'')}"></div>`; }
  return `<div class="topbar">
    <div class="brand">M.S.G. — ONE YEAR WAR SIMULATOR<span>U.C.0079 CAMPAIGN LOG</span></div>
    <div class="turnrow"><span class="turnlabel">LOG ${String(Math.min(turn,TOTAL_TURNS)).padStart(2,'0')}/${TOTAL_TURNS}</span>${dots}</div>
  </div>`;
}
function eraBadge(turn){
  const period = WAR_PERIODS[Math.min(turn,TOTAL_TURNS)-1];
  if(!period) return "";
  return `<div class="chip" style="display:inline-block;margin-bottom:8px;">戦局: ${period}</div>`;
}
function logBlock(history){
  if(!history || history.length===0) return "";
  const rows = history.slice().reverse().map(h=>`<div><b>T${h.turn} ${h.title}</b> — ${h.chosenLabel}。${h.summary}</div>`).join("");
  return `<div class="log">${rows}</div>`;
}
function errBlock(){ return S.err ? `<div class="errbox">${S.err}</div>` : ""; }

/* ---------- wiring ---------- */
function attach(){
  if(S.screen==="landing"){
    if(NOT_CONFIGURED) return;
    document.getElementById('goPlayer').addEventListener('click', ()=>{ S.role='player'; S.screen='nameEntry'; render(); });
    document.getElementById('goAdmin').addEventListener('click', async ()=>{
      S.role='admin'; S.screen='loading'; S.loadMsg='ロビー情報を取得中...'; render();
      let meta = await fetchGameState();
      if(!meta){ await updateGameState({ phase:'lobby', turn:0, fed:50, zeon:50, guild:65 }); meta = await fetchGameState(); }
      S.meta = meta; S.roster = await fetchRoster();
      S.screen = (meta.phase==='lobby') ? 'adminLobby' : meta.phase;
      render(); pollAsAdmin();
    });
    document.getElementById('goSolo').addEventListener('click', ()=>{ S.role='solo'; S.screen='nameEntry'; render(); });
  }
  if(S.screen==="nameEntry"){
    const f = document.getElementById('nameField');
    f.addEventListener('input', e=>{ S.nameInput = e.target.value; });
    f.addEventListener('keydown', e=>{ if(e.key==='Enter') (S.role==='solo'?soloRegister():registerPlayer()); });
    document.getElementById('submitName').addEventListener('click', ()=> S.role==='solo' ? soloRegister() : registerPlayer());
  }
  if(S.screen==="soloRoleReveal"){
    document.getElementById('soloStartBtn').addEventListener('click', soloStartGame);
  }
  if(S.screen==="soloVoting"){
    document.querySelectorAll('[data-solovote]').forEach(btn=>{
      btn.addEventListener('click', e=>{ soloChoose(+e.currentTarget.dataset.solovote); });
    });
  }
  if(S.screen==="adminLobby"){
    document.getElementById('startGameBtn').addEventListener('click', ()=>{ stopPoll(); adminStartGame().then(pollAsAdmin); });
    document.getElementById('resetBtn').addEventListener('click', adminResetAll);
  }
  if(S.screen==="voting" && S.role!=='admin'){
    document.querySelectorAll('[data-vote]').forEach(btn=>{
      btn.addEventListener('click', e=>{ submitVote(+e.currentTarget.dataset.vote); });
    });
  }
  if(S.screen==="voting" && S.role==='admin'){
    const b = document.getElementById('closeVoteBtn');
    if(b) b.addEventListener('click', ()=>{ stopPoll(); adminCloseVoting().then(pollAsAdmin); });
  }
  if(S.screen==="tally" && S.role==='admin'){
    document.getElementById('resolveBtn').addEventListener('click', ()=>{ stopPoll(); adminResolve().then(pollAsAdmin); });
  }
  if(S.screen==="resolution" && S.role==='admin'){
    document.getElementById('nextTurnBtn').addEventListener('click', ()=>{ stopPoll(); adminNext().then(pollAsAdmin); });
  }
  if(S.screen==="resolution" && S.role==='solo'){
    document.getElementById('nextTurnBtn').addEventListener('click', soloNext);
  }
  if(S.screen==="ending" && S.role==='admin'){
    const b = document.getElementById('resetBtn2');
    if(b) b.addEventListener('click', adminResetAll);
  }
  if(S.screen==="ending" && S.role==='solo'){
    const b = document.getElementById('soloResetBtn');
    if(b) b.addEventListener('click', soloReset);
  }
}

render();
</script>
